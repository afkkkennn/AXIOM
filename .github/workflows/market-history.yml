name: AXIOM historical market benchmark
on:
  push:
    paths:
      - 'axiom/market_history.py'
      - '.github/workflows/market-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m axiom.market_history
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-market-history
          path: reports/market_history/
