name: AXIOM timestamped injury archive research
on:
  push:
    paths:
      - 'axiom/official_injuries.py'
      - '.github/workflows/official-injuries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m axiom.official_injuries
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-official-injury-benchmark
          path: reports/official_injury/
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m axiom.official_injuries --current-only
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-current-injury-snapshots
          path: reports/official_injury/
