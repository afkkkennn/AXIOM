name: Reproduce AXIOM pilot
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m axiom.ingest
      - run: python -m axiom.backtest --team data/raw/pilot/team_boxscores.csv --player data/raw/pilot/boxscores.csv
      - run: cp data/raw/pilot/manifest.json reports/generated/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-pilot-results
          path: reports/generated/
