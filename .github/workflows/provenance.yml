name: AXIOM prospective provenance
on:
  workflow_dispatch:
  push:
    paths:
      - 'tracking/predictions.csv'
      - 'axiom/results_feed.py'
      - 'axiom/injury_archive.py'
      - '.github/workflows/provenance.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m axiom.injury_archive
      - run: python -m axiom.results_feed
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-prospective-audit
          path: reports/live/
